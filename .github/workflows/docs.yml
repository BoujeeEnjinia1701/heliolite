# Open Hardware Portfolio kit: check documents on every push; publish PDFs on release tags.
name: docs
on:
  push:
    branches: [main]
    tags: ["*-*-*/v*", "*-DWG-*/rev*"]
  pull_request:
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get install -y -q libpango-1.0-0 libpangoft2-1.0-0 fontconfig
      - run: pip install -q -r .kit/requirements.txt
      - name: Check document control
        run: python .kit/render.py --check
      - name: Render PDFs
        if: startsWith(github.ref, 'refs/tags/')
        run: python .kit/render.py
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            docs/pdf/*.pdf
            cad/drawings/*.pdf
